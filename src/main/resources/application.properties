# ============================================================================
# Configuración de la aplicación — Sistema de Gestión de Vehículos
# ============================================================================

# Conexión a MySQL 8.4 del contenedor `inventario-mysql` (fase 01).
# useSSL=false: interesa la integridad (no el cifrado) en la red local.
# serverTimezone=UTC: evita desfases horarios al leer/guardar fechas.
spring.datasource.url=jdbc:mysql://localhost:3306/inventario_vehiculos?useSSL=false&serverTimezone=UTC
spring.datasource.username=appuser
spring.datasource.password=app_pass_123

# El esquema (tablas vehiculos/autos/motocicletas) lo construyó la fase 01 con
# scripts SQL (db/01-schema.sql). Hibernate NO debe crearlo ni modificarlo:
# ddl-auto=none garantiza que el esquema de la BD es la única fuente de verdad.
spring.jpa.hibernate.ddl-auto=none

# Didáctico: ver en consola el SQL que Hibernate genera y formateado,
# para entender cómo traduce las entidades POO a las tablas relacionales.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
